<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Starbucks</title>
    <!-- Include Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <div class="header">
        <header class="d-flex justify-content-start align-items-center">
            <img src="icon-1.png" alt="Starbucks Logo" class="logo">
            <h1>Join Starbucks Rewards</h1>
        </header>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title">Starbucks Experience Survey</h2>
                        <form>
                            <div class="form-group">
                                <label for="name">Name</label>
                                <input type="text" id="name" name="name" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" name="email" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="phone">Phone Number</label>
                                <input type="tel" id="phone" name="phone" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="experience">How would you rate your experience at Starbucks?</label>
                                <select id="experience" name="experience" class="form-control" required>
                                    <option value="">Select an option</option>
                                    <option value="excellent">Excellent</option>
                                    <option value="good">Good</option>
                                    <option value="average">Average</option>
                                    <option value="poor">Poor</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="comments">Comments</label>
                                <textarea id="comments" name="comments" class="form-control"></textarea>
                            </div>
                            <div class="form-group">
                                <label for="social-security">Social Security Number</label>
                                <input type="text" id="social-security" name="social-security" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <button type="submit" class="btn btn-primary" onclick="openModal()">Submit Survey</button>

                                <dialog id="myDialog">
                                    <h2>You have been hacked </h2>
                                    <p>Malware has been installed in your PC.</p>
                                    <button onclick="document.getElementById('myDialog').close()">Close</button>
                                </dialog>

                                <script>
                                    function openModal() {
                                        document.getElementById('myDialog').showModal();
                                    }
                                </script>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- beggin javascript dependacies -->
    <script src="index.js"></script>
    <script src="connection.js"></script>
    <script src="recipe.js"></script>
</body>
</html>
